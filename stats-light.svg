<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 230" width="860" height="230" role="img" aria-label="GitHub stats">
  <style>
    .h { font: 500 12px 'SF Mono','Cascadia Code',Consolas,monospace; letter-spacing: 4px; fill: #8c959f; }
    .num { font: 300 34px 'Helvetica Neue','Segoe UI Light','Segoe UI',Arial,sans-serif; fill: #1f2328; }
    .lbl { font: 500 10px 'SF Mono','Cascadia Code',Consolas,monospace; letter-spacing: 1.5px; fill: #8c959f; }
    .lang { font: 400 13px 'Segoe UI','Helvetica Neue',Arial,sans-serif; fill: #57606a; }
    .pct { font: 400 12px 'SF Mono','Cascadia Code',Consolas,monospace; fill: #8c959f; }
    .up { opacity: 0; animation: up .9s cubic-bezier(.16,1,.3,1) forwards; }
    @keyframes up { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    .grow { transform-box: fill-box; transform-origin: left; transform: scaleX(0); animation: grow 1.1s cubic-bezier(.65,0,.35,1) forwards; }
    @keyframes grow { to { transform: scaleX(1); } }
    @media (prefers-reduced-motion: reduce) { .up, .grow { animation: none; opacity: 1; transform: none; } }
  </style>
  <rect x=".5" y=".5" width="859" height="229" rx="14" fill="#ffffff" stroke="#000000" stroke-opacity=".08"/>
  <text x="36" y="44" class="h">GITHUB · STATS</text>
  <text x="470" y="44" class="h">LANGUAGES</text>
  <line x1="436" y1="36" x2="436" y2="194" stroke="#000000" stroke-opacity=".07"/>
  <g class="up" style="animation-delay:0.15s"><text x="36" y="96" class="num">139</text><text x="36" y="118" class="lbl">STARS EARNED</text></g>
  <g class="up" style="animation-delay:0.23s"><text x="168" y="96" class="num">864</text><text x="168" y="118" class="lbl">COMMITS · 1Y</text></g>
  <g class="up" style="animation-delay:0.31s"><text x="300" y="96" class="num">26</text><text x="300" y="118" class="lbl">PULL REQUESTS</text></g>
  <g class="up" style="animation-delay:0.39s"><text x="36" y="170" class="num">914</text><text x="36" y="192" class="lbl">CONTRIBS · 1Y</text></g>
  <g class="up" style="animation-delay:0.47s"><text x="168" y="170" class="num">20</text><text x="168" y="192" class="lbl">PUBLIC REPOS</text></g>
  <g class="up" style="animation-delay:0.55s"><text x="300" y="170" class="num">3</text><text x="300" y="192" class="lbl">FOLLOWERS</text></g>
  <rect x="470" y="82" width="354" height="8" rx="4" fill="#000000" fill-opacity=".06"/>
  <clipPath id="bar"><rect x="470" y="82" width="354" height="8" rx="4"/></clipPath><g clip-path="url(#bar)">
  <rect class="grow" style="animation-delay:0.40s" x="470.00" y="82" width="263.26" height="8" fill="#555555"/>
  <rect class="grow" style="animation-delay:0.52s" x="732.76" y="82" width="32.86" height="8" fill="#f34b7d"/>
  <rect class="grow" style="animation-delay:0.64s" x="765.12" y="82" width="22.54" height="8" fill="#A97BFF"/>
  <rect class="grow" style="animation-delay:0.76s" x="787.15" y="82" width="10.32" height="8" fill="#dbb284"/>
  <rect class="grow" style="animation-delay:0.88s" x="796.97" y="82" width="9.92" height="8" fill="#3178c6"/>
  <rect class="grow" style="animation-delay:1.00s" x="806.39" y="82" width="6.10" height="8" fill="#41b883"/>
  <rect class="grow" style="animation-delay:1.12s" x="811.98" y="82" width="12.52" height="8" fill="#c4c9d0"/>
  </g>
  <g class="up" style="animation-delay:0.60s"><circle cx="475" cy="116" r="4.5" fill="#555555"/><text x="488" y="120" class="lang">C</text><text x="630" y="120" class="pct" text-anchor="end">74.2%</text></g>
  <g class="up" style="animation-delay:0.68s"><circle cx="655" cy="116" r="4.5" fill="#f34b7d"/><text x="668" y="120" class="lang">C++</text><text x="810" y="120" class="pct" text-anchor="end">9.1%</text></g>
  <g class="up" style="animation-delay:0.76s"><circle cx="475" cy="142" r="4.5" fill="#A97BFF"/><text x="488" y="146" class="lang">Kotlin</text><text x="630" y="146" class="pct" text-anchor="end">6.2%</text></g>
  <g class="up" style="animation-delay:0.84s"><circle cx="655" cy="142" r="4.5" fill="#dbb284"/><text x="668" y="146" class="lang">Pawn</text><text x="810" y="146" class="pct" text-anchor="end">2.8%</text></g>
  <g class="up" style="animation-delay:0.92s"><circle cx="475" cy="168" r="4.5" fill="#3178c6"/><text x="488" y="172" class="lang">TypeScript</text><text x="630" y="172" class="pct" text-anchor="end">2.7%</text></g>
  <g class="up" style="animation-delay:1.00s"><circle cx="655" cy="168" r="4.5" fill="#41b883"/><text x="668" y="172" class="lang">Vue</text><text x="810" y="172" class="pct" text-anchor="end">1.6%</text></g>
  <g class="up" style="animation-delay:1.08s"><circle cx="475" cy="194" r="4.5" fill="#c4c9d0"/><text x="488" y="198" class="lang">Other</text><text x="630" y="198" class="pct" text-anchor="end">3.4%</text></g>
</svg>
