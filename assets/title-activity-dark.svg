<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 64" width="860" height="64" role="img" aria-label="Activity">
  <style>
    .n { font: 500 12px 'JetBrains Mono','Cascadia Code','SF Mono',Consolas,monospace; letter-spacing: 2px; fill: #5c6370; }
    .t { font: 300 24px 'Helvetica Neue','Segoe UI Light','Segoe UI',Arial,sans-serif; letter-spacing: 8px; fill: #e4e6ea; }
    .c { font: 500 11px 'JetBrains Mono','Cascadia Code','SF Mono',Consolas,monospace; letter-spacing: 3px; fill: #6e737b; }
    .in { opacity: 0; animation: in 1.2s cubic-bezier(.16,1,.3,1) forwards; }
    @keyframes in { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: none; } }
    .ln { stroke-dasharray: 860; stroke-dashoffset: 860; animation: draw 1.6s cubic-bezier(.65,0,.35,1) .3s forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .dot { animation: pulse 2.4s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: .3; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .in { opacity: 1; } .ln { stroke-dashoffset: 0; } }
  </style>
  <g class="in">
    <text x="0" y="40" class="n">03</text>
    <circle class="dot" cx="48" cy="35.5" r="2.5" fill="#5c6370"/>
    <text x="74" y="43" class="t">ACTIVITY</text>
  </g>
  <line class="ln" x1="268" y1="36" x2="658" y2="36" stroke="#ffffff" stroke-opacity=".45" stroke-width="1"/>
  <text x="860" y="40" text-anchor="end" class="c in" style="animation-delay:.5s">WHAT I&#x27;VE BEEN UP TO</text>
</svg>
